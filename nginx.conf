# Static site and three fixed public API relays. No application runtime or build step.
proxy_cache_path /tmp/beamng-cache levels=1:2 keys_zone=public_api:1m max_size=20m inactive=5m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    access_log off;

    # Shared settings for the three API relays below.
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host $proxy_host;
    # Visitors' headers, cookies and request bodies are not forwarded.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_cache public_api;
    proxy_cache_key $uri;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /informations-legales {
        try_files /informations-legales/index.html =404;
    }
    location = /api/beammp {
        limit_except GET { deny all; }
        proxy_pass https://backend.beammp.com/servers-info;
        proxy_cache_valid 200 60s;
        add_header Cache-Control no-store;
    }
    location = /api/discord-widget {
        limit_except GET { deny all; }
        proxy_pass https://discord.com/api/guilds/828656939365957742/widget.json;
        proxy_cache_valid 200 300s;
        add_header Cache-Control no-store;
    }
    location = /api/discord-invite {
        limit_except GET { deny all; }
        proxy_pass https://discord.com/api/v10/invites/h9RD9KW8?with_counts=true;
        proxy_cache_valid 200 300s;
        add_header Cache-Control no-store;
    }
}
